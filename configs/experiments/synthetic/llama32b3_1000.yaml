kind: augmentation
name: synthetic_llama32B3_1000
description: Generate the assignment-required 1000 synthetic ABSA reviews with Llama 3.2 3B.

output_root: artifacts/generated_data
count: 1000

model:
  name: llama32B3
  path:
  device: auto

prompt:
  file: configs/prompts/generation/synthetic_reviews.yaml

few_shot:
  shots: 8
  strategy: diverse

decoding:
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 512

seed: 13
