kind: inference
name: final_finetune_decoding_best_adapters
description: Fine-tuned inference decoding and repair sweep for current best copied-back adapters.

split: devel
output_root: runs

model:
  name: llama32B3
  quantization: 4bit
  device: auto
  adapter: boada/runs/finetune/finetune_llama_lora_gpt55_synth_10ep-mgl1013-finetune-llama32B3-my_prompt-q4bit-lr2e-05-ep10-bs1-ga8-len512-bf16-seed13/adapter

prompt:
  file: configs/prompts/zero_shot/my_prompt.yaml

few_shot:
  shots: 0
  strategy: first

decoding:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 512
  constraint: none

repair_policy: none
seed: 13

matrix:
  model.name: [llama32B3]
  model.adapter:
    - boada/runs/finetune/finetune_llama_lora_gpt55_synth_10ep-mgl1013-finetune-llama32B3-my_prompt-q4bit-lr2e-05-ep10-bs1-ga8-len512-bf16-seed13/adapter
  decoding.temperature: [0.0, 0.1, 0.2, 0.3]
  decoding.top_p: [1.0, 0.9, 0.95]
  repair_policy: [none, aliases]
