kind: finetune
name: final_finetune_lora_lr_rank_batch
description: LoRA rank/LR/effective-batch sweep inspired by Thinking Machines LoRA guidance.

output_root: runs

model:
  name: llama32B3
  path:
  quantization: 4bit
  device: auto

prompt:
  file: configs/prompts/zero_shot/my_prompt.yaml

data:
  train: artifacts/generated_data/gpt5.5_1000/train_plus_synth.json
  devel: devel
  synthetic:

training:
  max_length: 512
  epochs: 5
  learning_rate: 0.00002
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  eval_accumulation_steps: 4
  save_total_limit: 1
  bf16: true
  fp16: false
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_grad_norm: 1.0

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all_linear

seed: 13

matrix:
  lora.r: [8, 16, 32]
  training.learning_rate: [0.00001, 0.00002, 0.00005, 0.0001]
  training.gradient_accumulation_steps: [2, 4, 8]
  training.epochs: [5, 10]
