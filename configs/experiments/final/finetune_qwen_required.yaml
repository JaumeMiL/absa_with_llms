kind: finetune
name: final_finetune_qwen_required
description: "Required Qwen fine-tuning coverage: train-only, GPT synthetic, language-fixed Llama synthetic, and weak-polarity synthetic; QLoRA plus normal LoRA check."

output_root: runs

model:
  name: qwen25B3
  path:
  quantization: 4bit
  device: auto

prompt:
  file: configs/prompts/zero_shot/my_prompt.yaml

data:
  train: train
  devel: devel
  synthetic:

training:
  max_length: 512
  epochs: 5
  learning_rate: 0.00002
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  eval_accumulation_steps: 4
  save_total_limit: 1
  bf16: true
  fp16: false
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_grad_norm: 1.0

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: attention_qv

seed: 13

variants:
  - variant: train_only_qlora
    data.train: train
    data.synthetic:
    model.quantization: 4bit
  - variant: gpt55_synth_qlora
    data.train: artifacts/generated_data/gpt5.5_1000/train_plus_synth.json
    data.synthetic:
    model.quantization: 4bit
  - variant: llama_language_fixed_qlora
    data.train: artifacts/generated_data/synthetic_llama32B3_1000_language_fixed-augmentation-llama32B3-synthetic_reviews-qnone-8shots-diverse-t0.8-p0.95-seed13/train_plus_synth.json
    data.synthetic:
    model.quantization: 4bit
  - variant: weak_polarity_qlora
    data.train: artifacts/generated_data/gpt5.5_1000/train_plus_synth.json
    data.synthetic: artifacts/generated_data/synthetic_weak_aspects_600-augmentation-llama32B3-synthetic_reviews-qnone-8shots-coverage_rerank-t0.8-p0.95-seed13/synt.json
    model.quantization: 4bit
  - variant: gpt55_synth_lora_nonquant
    data.train: artifacts/generated_data/gpt5.5_1000/train_plus_synth.json
    data.synthetic:
    model.quantization: none
