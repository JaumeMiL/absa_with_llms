kind: finetune
name: final_finetune_llama_language_fixed_synth
description: Train Llama on corrected language-balanced Llama synthetic data.

output_root: runs

model:
  name: llama32B3
  path:
  quantization: 4bit
  device: auto

prompt:
  file: configs/prompts/zero_shot/my_prompt.yaml

data:
  train: artifacts/generated_data/synthetic_llama32B3_1000_language_fixed-augmentation-llama32B3-synthetic_reviews-qnone-8shots-diverse-t0.8-p0.95-seed13/train_plus_synth.json
  devel: devel
  synthetic:

training:
  max_length: 512
  epochs: 10
  learning_rate: 0.00002
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  eval_accumulation_steps: 4
  save_total_limit: 2
  bf16: true
  fp16: false
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_grad_norm: 1.0

lora:
  r: 8
  alpha: 32
  dropout: 0.05
  target_modules: attention_qv

seeds: [13, 42, 101]
