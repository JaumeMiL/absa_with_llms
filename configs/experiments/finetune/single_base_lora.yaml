kind: finetune
name: finetune_llama_lora_gpt55_synth
description: One LoRA fine-tuning run on the original train split.

output_root: runs

model:
  name: llama32B3
  path:
  quantization: 4bit

prompt:
  file: configs/prompts/zero_shot/my_prompt.yaml

data:
  train: artifacts/generated_data/gpt5.5_1000/train_plus_synth.json
  devel: devel
  synthetic:

training:
  max_length: 512
  epochs: 3
  learning_rate: 0.00002
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  eval_accumulation_steps: 4
  save_total_limit: 2
  bf16: true
  fp16: false

lora:
  r: 8
  alpha: 16
  dropout: 0.05

seed: 13
