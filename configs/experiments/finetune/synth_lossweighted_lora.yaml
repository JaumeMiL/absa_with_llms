kind: finetune
name: finetune_llama_lora_gpt55_synth_lossweighted

output: runs

model:
  name: llama32B3
  quantization: 4bit

prompt:
  file: configs/prompts/zero_shot/my_prompt.yaml

data:
  train: artifacts/generated_data/gpt5.5_1000/train_plus_synth.json
  devel: devel

training:
  epochs: 3
  learning_rate: 2.0e-5
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_length: 512
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  loss_weighting: inverse_sqrt
  max_example_weight: 4.0

seed: 13
