kind: finetune
name: finetune_llama_synth_hparam
description: Small QLoRA hyperparameter sweep on train plus Llama-generated synthetic data. Update data.train after the synthetic generation job finishes.

output_root: runs

model:
  name: llama32B3
  path:
  quantization: 4bit
  device: auto

prompt:
  file: configs/prompts/zero_shot/my_prompt.yaml

data:
  # Replace this path with the generated run folder, e.g.
  # artifacts/generated_data/synthetic_llama32B3_1000-mgl1008-augmentation-llama32B3-synthetic_reviews-8shots-diverse-t0.8-p0.95-seed13/train_plus_synth.json
  train: artifacts/generated_data/synthetic_llama32B3_1000-mgl1008-augmentation-llama32B3-synthetic_reviews-8shots-diverse-t0.8-p0.95-seed13/train_plus_synth.json
  devel: devel
  synthetic:

training:
  max_length: 512
  epochs: 2
  learning_rate: 0.00002
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  eval_accumulation_steps: 4
  save_total_limit: 1
  bf16: true
  fp16: false

lora:
  r: 8
  alpha: 16
  dropout: 0.05

seed: 13

matrix:
  training.learning_rate: [0.00001, 0.00002]
  training.epochs: [3]
  training.gradient_accumulation_steps: [8]
