kind: inference
name: report_zero_shot_new_prompt
description: Compact report-quality zero-shot comparison with canonical quantization, three seeds, and the new confusion-guard prompt.

split: devel
output_root: runs
limit:

model:
  name: llama32B3
  path:
  quantization: none
  device: auto

prompt:
  file: configs/prompts/zero_shot/my_prompt.yaml

few_shot:
  shots: 0
  strategy: first

decoding:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 512

seeds: [13]

matrix:
  model.name: [llama32B3, qwen25B3]
  model.quantization: [none, 4bit]
  prompt.file:
    - configs/prompts/zero_shot/confusion_guard.yaml
