kind: inference
name: zero_shot_decoding_sweep
description: Zero-shot comparison across reportable decoding settings, seeds, and optional 4-bit.

split: devel
output_root: runs
limit:

model:
  name: llama32B3
  path:
  quantization: none

prompt:
  file: configs/prompts/zero_shot/baseline.yaml

few_shot:
  shots: 0
  strategy: first

decoding:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 512

seeds: [13, 42, 101]

matrix:
  model.name: [llama32B3, qwen25B3]
  model.quantization: [none]
  prompt.file:
    - configs/prompts/zero_shot/definitions.yaml
  decoding.temperature: [0.0, 0.2, 0.5]
  decoding.top_p: [1.0, 0.9, 0.5]
