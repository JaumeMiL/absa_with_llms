# la gracia esq tb podem mantenir single runs rollo no tot han de ser
# combinatories de coses pots tenir

kind: inference
name: zero_shot_single_llama

split: devel
output: runs

model:
  name: llama32B3
  quantization: none
  device: auto

prompt:
  file: configs/prompts/zero_shot/my_prompt.yaml

few_shot:
  shots: 0

decoding:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 256

seed: 13
